plugins {
    id 'com.android.application'
}

android {
    namespace 'de.cleanhome.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'de.cleanhome.launcher'
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
