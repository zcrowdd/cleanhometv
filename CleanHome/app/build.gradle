plugins {
    id 'com.android.application'
}

android {
    namespace 'de.cleanhome.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'de.cleanhome.launcher'
        minSdk 22
        targetSdk 34
        // jede GitHub-Version bekommt eine hoehere Nummer -> sauberes Update
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // Fester Schluessel im Repo: jede gebaute APK hat dieselbe Signatur,
    // sonst lehnt Android Updates ab ("signatures do not match").
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // Die ausgelieferte APK (Build-Typ "debug", damit Dateiname und Selbst-Update gleich bleiben)
    // ist trotzdem eine optimierte Release-Version: nicht debugbar -> ART kompiliert und optimiert voll,
    // R8 optimiert den Code und wirft Ungenutztes raus.
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'   // QR-Code fuer die Handy-Steuerung
}
